<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>bynon.art 委託排單</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Noto+Serif+TC:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#1a1209;--paper:#fdf6e8;--cream:#f5e9cc;--gold:#c8922a;--gold-light:#e8b84b;
  --rust:#b5452b;--sage:#6b8f6e;--muted:#8a7a5e;--border:#d4b896;--shadow:rgba(26,18,9,0.12);--blue:#4a7fc1;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--paper);color:var(--ink);font-family:'Noto Serif TC',serif;min-height:100vh;
  background-image:radial-gradient(ellipse at 10% 20%,rgba(200,146,42,.06) 0%,transparent 50%),
  radial-gradient(ellipse at 90% 80%,rgba(181,69,43,.05) 0%,transparent 50%),
  url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23c8922a' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/svg%3E");}
header{background:var(--ink);color:var(--paper);padding:1.5rem 1.5rem 1.3rem;display:flex;align-items:center;
  justify-content:space-between;gap:1rem;border-bottom:3px solid var(--gold);position:relative;overflow:hidden;}
header::before{content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(-45deg,transparent,transparent 20px,rgba(200,146,42,.04) 20px,rgba(200,146,42,.04) 21px);pointer-events:none;}
.hbrand{position:relative;}
.hbrand h1{font-family:'Playfair Display',serif;font-size:clamp(1.2rem,3vw,1.75rem);font-weight:700;line-height:1.2;}
.hbrand h1 em{font-style:italic;color:var(--gold-light);}
.hbrand p{font-size:.7rem;color:rgba(253,246,232,.5);letter-spacing:.15em;text-transform:uppercase;margin-top:.2rem;}
.header-right{display:flex;align-items:center;gap:.6rem;flex-shrink:0;}
.admin-btn{background:transparent;border:1px solid rgba(253,246,232,.25);color:rgba(253,246,232,.6);
  padding:.38rem .85rem;border-radius:3px;font-family:'Noto Serif TC',serif;font-size:.76rem;cursor:pointer;transition:all .2s;}
.admin-btn:hover{border-color:var(--gold-light);color:var(--gold-light);}
.admin-btn.active{background:var(--gold);border-color:var(--gold);color:#fff;}
.logout-btn{background:transparent;border:none;color:rgba(253,246,232,.4);font-size:.7rem;cursor:pointer;font-family:'Noto Serif TC',serif;padding:.2rem .35rem;}
.logout-btn:hover{color:var(--rust);}
.admin-label{font-size:.7rem;color:var(--gold-light);letter-spacing:.06em;}
.nav-tabs{display:flex;background:var(--cream);border-bottom:2px solid var(--border);overflow-x:auto;}
.nav-tab{flex:1;min-width:max-content;padding:.72rem .85rem;border:none;background:transparent;
  font-family:'Noto Serif TC',serif;font-size:.82rem;color:var(--muted);cursor:pointer;
  transition:all .2s;border-bottom:3px solid transparent;margin-bottom:-2px;}
.nav-tab.active{color:var(--gold);border-bottom-color:var(--gold);background:var(--paper);font-weight:600;}
.nav-tab:hover:not(.active){color:var(--ink);background:rgba(200,146,42,.06);}
.tab-badge{display:inline-flex;align-items:center;justify-content:center;background:var(--rust);color:#fff;
  font-size:.6rem;font-weight:700;width:14px;height:14px;border-radius:50%;margin-left:3px;vertical-align:middle;}
main{max-width:860px;margin:0 auto;padding:1.75rem 1rem 4rem;}
.panel{display:none;}.panel.active{display:block;animation:fadeUp .3s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.sec-title{font-family:'Playfair Display',serif;font-size:1.15rem;color:var(--ink);
  margin-bottom:1rem;padding-bottom:.4rem;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:.5rem;}
.sec-title .icon{color:var(--gold);}
.form-card{background:#fff;border:1px solid var(--border);border-radius:4px;padding:1.35rem;margin-bottom:1.6rem;box-shadow:0 2px 12px var(--shadow);}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:.85rem;}
.fg{display:flex;flex-direction:column;gap:.28rem;}
.fg.full{grid-column:1/-1;}
label{font-size:.74rem;color:var(--muted);letter-spacing:.05em;text-transform:uppercase;}
label .req{color:var(--rust);}
input,select,textarea{border:1px solid var(--border);border-radius:3px;padding:.52rem .68rem;
  font-family:'Noto Serif TC',serif;font-size:.87rem;color:var(--ink);background:var(--paper);transition:border-color .2s;width:100%;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold);background:#fff;}
textarea{resize:vertical;min-height:75px;}
.btn{display:inline-flex;align-items:center;gap:.35rem;padding:.52rem 1.15rem;border:none;border-radius:3px;
  font-family:'Noto Serif TC',serif;font-size:.84rem;cursor:pointer;transition:all .18s;}
.btn-gold{background:var(--gold);color:#fff;font-weight:600;}
.btn-gold:hover{background:var(--gold-light);transform:translateY(-1px);box-shadow:0 3px 10px rgba(200,146,42,.35);}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--muted);}
.btn-ghost:hover{background:var(--cream);}
.btn-sage{background:var(--sage);color:#fff;}
.btn-sage:hover{background:#559558;}
.btn-rust{background:transparent;color:var(--rust);border:1px solid var(--rust);}
.btn-rust:hover{background:var(--rust);color:#fff;}
.btn-sm{padding:.22rem .55rem;font-size:.74rem;}
.btn-full{width:100%;justify-content:center;padding:.68rem;font-size:.9rem;}
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(95px,1fr));gap:.6rem;margin-bottom:1.3rem;}
.stat-box{background:#fff;border:1px solid var(--border);border-radius:4px;padding:.7rem .85rem;text-align:center;box-shadow:0 1px 4px var(--shadow);}
.stat-num{font-family:'Playfair Display',serif;font-size:1.45rem;color:var(--gold);line-height:1;}
.stat-label{font-size:.66rem;color:var(--muted);margin-top:.12rem;}
.review-wrap{background:#fffaf0;border:1px solid #e6c97a;border-radius:4px;padding:1.15rem;margin-bottom:1.6rem;}
.review-wrap .sec-title{border-bottom-color:#e6c97a;font-size:1rem;}
.review-card{background:#fff;border:1px solid #e6c97a;border-left:4px solid var(--gold);
  border-radius:4px;padding:.85rem 1.05rem;margin-bottom:.6rem;animation:fadeUp .25s ease;}
.review-card:last-child{margin-bottom:0;}
.rc-head{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:.4rem;}
.rc-name{font-weight:600;font-size:.9rem;}.rc-type{font-size:.76rem;color:var(--muted);}
.rc-body{margin:.5rem 0;font-size:.82rem;line-height:1.65;}
.rc-field{margin-bottom:.22rem;}.rc-field .lbl{color:var(--muted);font-size:.7rem;display:block;text-transform:uppercase;letter-spacing:.05em;}
.rc-field a{color:var(--blue);font-size:.82rem;word-break:break-all;}
.rc-foot{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.35rem;margin-top:.55rem;}
.rc-date{font-size:.68rem;color:var(--muted);}.rc-acts{display:flex;gap:.3rem;align-items:center;}
.reject-box{display:none;margin-top:.45rem;}.reject-box textarea{min-height:45px;}
.reject-box-btns{display:flex;gap:.3rem;justify-content:flex-end;margin-top:.3rem;}
.q-controls{display:flex;gap:.65rem;margin-bottom:.85rem;flex-wrap:wrap;align-items:center;}
.q-controls input{flex:1;min-width:140px;max-width:250px;}
.q-list{display:flex;flex-direction:column;gap:.65rem;}
.com-card{background:#fff;border:1px solid var(--border);border-left:4px solid var(--border);
  border-radius:4px;padding:.85rem 1.05rem;box-shadow:0 1px 6px var(--shadow);transition:transform .15s,box-shadow .15s;}
.com-card:hover{transform:translateY(-1px);box-shadow:0 3px 14px var(--shadow);}
.com-card[data-status="待確認"]{border-left-color:var(--muted);}
.com-card[data-status="已確認"]{border-left-color:var(--blue);}
.com-card[data-status="構圖中"]{border-left-color:var(--gold);}
.com-card[data-status="待審構圖"]{border-left-color:#d4a017;}
.com-card[data-status="線稿中"]{border-left-color:#c18e4a;}
.com-card[data-status="待審線稿"]{border-left-color:#e07b39;}
.com-card[data-status="上色中"]{border-left-color:#9b59b6;}
.com-card[data-status="待審色稿"]{border-left-color:#7d3c98;}
.com-card[data-status="修改中"]{border-left-color:var(--rust);}
.com-card[data-status="完成"]{border-left-color:var(--sage);}
.com-card[data-status="取消"]{border-left-color:#aaa;opacity:.65;}
.cc-head{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:.45rem;}
.cc-meta{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap;}
.onum{font-family:'Playfair Display',serif;font-size:.9rem;font-weight:700;color:var(--gold);letter-spacing:.05em;}
.cname{font-weight:600;font-size:.9rem;}.ctype{font-size:.74rem;color:var(--muted);}
.sbadge{display:inline-block;padding:.16rem .58rem;border-radius:20px;font-size:.7rem;font-weight:600;white-space:nowrap;}
.s待確認{background:#eee;color:#666;}.s已確認{background:#dbeafe;color:#1e40af;}
.s構圖中{background:#fef3c7;color:#92400e;}.s待審構圖{background:#fde68a;color:#78350f;}
.s線稿中{background:#fde8cc;color:#8b4513;}.s待審線稿{background:#fed7aa;color:#7c2d12;}
.s上色中{background:#f3e8ff;color:#6b21a8;}.s待審色稿{background:#e9d5ff;color:#581c87;}
.s完成{background:#d1fae5;color:#065f46;}.s修改中{background:#fee2e2;color:#991b1b;}
.s取消{background:#f3f4f6;color:#6b7280;}
.cc-body{margin-top:.48rem;font-size:.82rem;color:var(--muted);line-height:1.6;}
.cc-note{font-size:.78rem;color:var(--ink);margin-top:.22rem;font-style:italic;}
.cc-foot{margin-top:.6rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.38rem;}
.cc-date{font-size:.7rem;color:var(--muted);}.cc-acts{display:flex;gap:.32rem;flex-wrap:wrap;}
.isel{border:1px solid var(--border);border-radius:3px;padding:.2rem .36rem;
  font-size:.74rem;font-family:'Noto Serif TC',serif;color:var(--ink);background:var(--paper);cursor:pointer;}
.qpos{display:inline-block;background:var(--cream);color:var(--muted);font-size:.68rem;
  padding:.07rem .42rem;border-radius:20px;border:1px solid var(--border);font-family:'Playfair Display',serif;}
.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:.9rem;margin-bottom:1rem;}
.slot-month-card{background:#fff;border:1px solid var(--border);border-radius:4px;padding:.9rem 1rem;box-shadow:0 1px 4px var(--shadow);}
.slot-month-card h4{font-family:'Playfair Display',serif;font-size:.92rem;color:var(--ink);margin-bottom:.6rem;}
.slot-row{display:flex;align-items:center;gap:.45rem;margin-bottom:.4rem;}
.slot-row label{font-size:.74rem;color:var(--muted);min-width:65px;text-transform:none;letter-spacing:0;}
.slot-row input[type=number]{width:62px;text-align:center;}
.slot-toggle{display:flex;align-items:center;gap:.38rem;margin-bottom:.45rem;}
.toggle-label{font-size:.76rem;color:var(--muted);}
.switch{position:relative;display:inline-block;width:34px;height:19px;}
.switch input{opacity:0;width:0;height:0;}
.slider{position:absolute;cursor:pointer;inset:0;background:#ccc;border-radius:20px;transition:.3s;}
.slider:before{position:absolute;content:'';height:13px;width:13px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.3s;}
input:checked+.slider{background:var(--sage);}
input:checked+.slider:before{transform:translateX(15px);}
.settings-save-row{display:flex;justify-content:flex-end;gap:.45rem;margin-top:.4rem;}
.slots-public{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:.6rem;margin-bottom:1.4rem;}
.slot-pub-card{background:#fff;border:1px solid var(--border);border-radius:4px;padding:.8rem .9rem;text-align:center;box-shadow:0 1px 4px var(--shadow);}
.slot-month-name{font-family:'Playfair Display',serif;font-size:.95rem;color:var(--ink);margin-bottom:.25rem;}
.slot-remain{font-size:1.45rem;font-family:'Playfair Display',serif;font-weight:700;}
.slot-remain.ok{color:var(--sage);}.slot-remain.low{color:var(--gold);}.slot-remain.none{color:var(--rust);}
.slot-sublabel{font-size:.66rem;color:var(--muted);margin-top:.08rem;}
.submit-wrap{background:linear-gradient(135deg,#fffdf7,#fdf6e8);border:1px solid #e6c97a;
  border-radius:6px;padding:1.65rem;box-shadow:0 4px 20px rgba(200,146,42,.1);}
.submit-intro{text-align:center;margin-bottom:1.4rem;padding-bottom:1.15rem;border-bottom:1px dashed var(--border);}
.submit-intro .di{font-size:2rem;display:block;margin-bottom:.45rem;}
.submit-intro h2{font-family:'Playfair Display',serif;font-size:1.3rem;margin-bottom:.32rem;}
.submit-intro p{font-size:.82rem;color:var(--muted);line-height:1.65;}
.price-notice{background:var(--cream);border:1px solid var(--border);border-radius:3px;
  padding:.55rem .8rem;margin-bottom:1rem;font-size:.82rem;color:var(--ink);line-height:1.6;}
.price-notice strong{color:var(--gold);}
.closed-wall{text-align:center;padding:2.25rem 1rem;}
.closed-wall .cw-icon{font-size:2.8rem;display:block;margin-bottom:.7rem;}
.closed-wall h3{font-family:'Playfair Display',serif;font-size:1.25rem;margin-bottom:.45rem;}
.closed-wall p{color:var(--muted);font-size:.84rem;line-height:1.7;}
.success-box{display:none;text-align:center;padding:1.75rem 1rem;}
.success-box .si{font-size:2.8rem;display:block;margin-bottom:.7rem;}
.success-box h3{font-family:'Playfair Display',serif;font-size:1.25rem;margin-bottom:.38rem;}
.success-box p{color:var(--muted);font-size:.82rem;line-height:1.7;}
.order-reveal{display:inline-block;margin:1rem auto 0;background:var(--ink);color:var(--gold-light);
  font-family:'Playfair Display',serif;font-size:1.2rem;font-weight:700;padding:.48rem 1.4rem;border-radius:4px;letter-spacing:.1em;}
.lookup-box{background:#fff;border:1px solid var(--border);border-radius:4px;padding:1.65rem;
  max-width:480px;margin:0 auto 1.65rem;box-shadow:0 2px 12px var(--shadow);text-align:center;}
.lookup-box .di{font-size:2rem;display:block;margin-bottom:.55rem;}
.lookup-box h2{font-family:'Playfair Display',serif;font-size:1.2rem;margin-bottom:.32rem;}
.lookup-box p{font-size:.8rem;color:var(--muted);margin-bottom:.95rem;}
.lookup-row{display:flex;gap:.42rem;}.lookup-row input{flex:1;}
.result-card{background:#fff;border:1px solid var(--border);border-radius:4px;padding:1.35rem;
  max-width:480px;margin:0 auto;box-shadow:0 2px 16px var(--shadow);animation:fadeUp .3s ease;}
.res-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:.85rem;flex-wrap:wrap;gap:.45rem;}
.res-order{font-family:'Playfair Display',serif;font-size:1rem;color:var(--gold);font-weight:700;}
.prog-steps{display:flex;gap:0;margin:1rem 0;overflow-x:auto;padding-bottom:.18rem;}
.step{flex:1;text-align:center;position:relative;min-width:50px;}
.step::before{content:'';position:absolute;top:10px;left:50%;right:-50%;height:2px;background:var(--border);z-index:0;}
.step:last-child::before{display:none;}
.sdot{width:22px;height:22px;border-radius:50%;background:#e5d9c5;border:2px solid var(--border);
  margin:0 auto .28rem;display:flex;align-items:center;justify-content:center;font-size:.58rem;position:relative;z-index:1;transition:all .3s;}
.step.done .sdot{background:var(--sage);border-color:var(--sage);color:#fff;}
.step.curr .sdot{background:var(--gold);border-color:var(--gold);color:#fff;box-shadow:0 0 0 4px rgba(200,146,42,.2);}
.slabel{font-size:.62rem;color:var(--muted);line-height:1.3;}
.step.done .slabel,.step.curr .slabel{color:var(--ink);}
.res-dl{font-size:.83rem;line-height:1.75;}
.res-dl dt{color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;}
.res-dl dd{color:var(--ink);margin-bottom:.32rem;}
.modal-ov{display:none;position:fixed;inset:0;background:rgba(26,18,9,.55);z-index:200;align-items:center;justify-content:center;padding:1rem;}
.modal-ov.open{display:flex;}
.modal{background:var(--paper);border:1px solid var(--border);border-radius:4px;padding:1.5rem;
  width:100%;max-width:500px;box-shadow:0 8px 32px rgba(0,0,0,.2);animation:fadeUp .25s ease;}
.modal h3{font-family:'Playfair Display',serif;font-size:1.08rem;margin-bottom:.85rem;}
.mfoot{display:flex;justify-content:flex-end;gap:.42rem;margin-top:1rem;}
.pw-modal{max-width:320px;text-align:center;}
.pw-modal .lock{font-size:1.9rem;display:block;margin-bottom:.45rem;}
.pw-modal input{text-align:center;letter-spacing:.12em;font-size:.95rem;}
.pw-err{color:var(--rust);font-size:.78rem;margin-top:.35rem;min-height:1.1rem;}
.toast{position:fixed;bottom:1.4rem;right:1.4rem;background:var(--ink);color:var(--paper);
  padding:.6rem 1.05rem;border-radius:4px;font-size:.82rem;border-left:3px solid var(--gold);
  box-shadow:0 4px 16px rgba(0,0,0,.25);z-index:999;animation:slideIn .3s ease;max-width:260px;}
.toast.hide{animation:slideOut .3s ease forwards;}
@keyframes slideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
@keyframes slideOut{from{opacity:1;transform:translateX(0)}to{opacity:0;transform:translateX(20px)}}
.empty-state{text-align:center;padding:2.25rem 1rem;color:var(--muted);font-style:italic;}
.loading{text-align:center;padding:2rem;color:var(--muted);font-size:.85rem;}
/* DROPDOWN EDITOR */
.dd-editor{margin-bottom:.5rem;}
.dd-list{list-style:none;display:flex;flex-direction:column;gap:.3rem;margin-bottom:.5rem;}
.dd-item{display:flex;align-items:center;gap:.4rem;background:var(--cream);border:1px solid var(--border);border-radius:3px;padding:.3rem .5rem;}
.dd-item span{flex:1;font-size:.84rem;}
.dd-item button{background:none;border:none;cursor:pointer;font-size:.85rem;color:var(--muted);padding:.1rem .2rem;}
.dd-item button:hover{color:var(--rust);}
.dd-add-row{display:flex;gap:.4rem;}.dd-add-row input{flex:1;font-size:.84rem;}
.dd-section-title{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:.4rem;}
@media(max-width:520px){.fgrid,.settings-grid{grid-template-columns:1fr;}.fg.full{grid-column:1;}header{flex-direction:column;text-align:center;}}
</style>
</head>
<body>

<header>
  <div class="hbrand">
    <h1>✦ <em>bynon.art</em> 委託排單</h1>
    <p>Commission Queue System</p>
  </div>
  <div class="header-right">
    <span class="admin-label" id="admin-label" style="display:none;">管理員模式</span>
    <button class="logout-btn" id="logout-btn" style="display:none;" onclick="logout()">登出</button>
    <button class="admin-btn" id="admin-btn" onclick="openPwModal()">🔐 管理員</button>
  </div>
</header>

<div class="nav-tabs" id="nav-tabs"></div>

<main>
  <div class="panel active" id="panel-submit">
    <div id="submit-slots-row"></div>
    <div id="submit-body"><div class="loading">載入中…</div></div>
  </div>
  <div class="panel" id="panel-lookup">
    <div class="lookup-box">
      <span class="di">🖌️</span>
      <h2>查詢委託進度</h2>
      <p>輸入您的委託編號（COM-… 或 PND-… 皆可）</p>
      <div class="lookup-row">
        <input type="text" id="lookup-input" placeholder="COM-0001">
        <button class="btn btn-gold" onclick="doLookup()">查詢</button>
      </div>
    </div>
    <div id="lookup-result"></div>
  </div>
  <div class="panel" id="panel-queue">
    <div class="stats-row" id="stats-row"></div>
    <div class="review-wrap" id="review-wrap" style="display:none;">
      <div class="sec-title"><span class="icon">⏳</span> 待審核投單</div>
      <div id="review-list"></div>
    </div>
    <div class="sec-title"><span class="icon">✦</span> 委託排單</div>
    <div class="q-controls">
      <input type="text" id="search-input" placeholder="搜尋委託人或單號…" oninput="renderQueue()">
      <select class="isel" id="filter-status" onchange="renderQueue()" style="font-size:.8rem;padding:.38rem .48rem;">
        <option value="">全部狀態</option>
        <option>待確認</option><option>已確認</option><option>構圖中</option><option>待審構圖</option>
        <option>線稿中</option><option>待審線稿</option><option>上色中</option><option>待審色稿</option>

// ══ SUPABASE HELPER ══
async function sb(table, method='GET', body=null, query=''){
  const url=`${SB_URL}/rest/v1/${table}${query}`;
  const headers={'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Prefer':'return=representation'};
  const res=await fetch(url,{method,headers,body:body?JSON.stringify(body):null});
  if(!res.ok){const e=await res.text();throw new Error(e);}
  const txt=await res.text();
  return txt?JSON.parse(txt):null;
}
const dbGet    = (t,q='')      => sb(t,'GET',null,q);
const dbInsert = (t,body)      => sb(t,'POST',body);
const dbUpdate = (t,q,body)    => sb(t,'PATCH',body,q);
const dbDelete = (t,q)         => sb(t,'DELETE',null,q);

// ══ SETTINGS PERSISTENCE ══
async function loadSettings(){
  try{
    const rows=await dbGet('app_settings');
    if(rows&&rows.length){
      rows.forEach(r=>{ try{ settings[r.key]=r.value; }catch(e){} });
      // ensure slots is plain object with numeric keys
      if(settings.slots){
        const fixed={};
        Object.entries(settings.slots).forEach(([k,v])=>fixed[+k]=v);
        settings.slots=fixed;
        // fill missing months
        for(let m=1;m<=12;m++) if(!settings.slots[m]) settings.slots[m]={open:false,limit:2};
      }
    }
  }catch(e){console.warn('loadSettings error',e);}
}
async function persistSettings(){
  const keys=['announcement','priceNote','contactLink','contactName','slots','commissionTypes','purposes','paymentMethods','idCounter'];
  for(const key of keys){
    try{
      // upsert via delete+insert
      await dbDelete('app_settings',`?key=eq.${key}`);
      await dbInsert('app_settings',{key,value:settings[key]});
    }catch(e){console.warn('persistSettings error',key,e);}
  }
}

function getAvail(m){
  const s=settings.slots[m];
  if(!s||!s.open)return null;
  return s.limit?Math.max(0,s.limit-getUsed(m)):Infinity;
}
function hasOpenSlot(){return Object.keys(settings.slots).some(m=>{const a=getAvail(+m);return a===Infinity||a>0;});}

async function submitCommission(){
  const client=(document.getElementById('s-client')?.value||'').trim();
  const contact=(document.getElementById('s-contact')?.value||'').trim();
  const desc=(document.getElementById('s-desc')?.value||'').trim();
  const month=+(document.getElementById('s-month')?.value||0);
  if(!client||!contact||!desc){toast('請填寫必填欄位 *');return;}
  const avail=getAvail(month);
  if(avail!==Infinity&&avail<=0){toast('抱歉，該月份已額滿！');renderSubmitPage();return;}
  const pid='PND-'+Date.now();
  const p={id:pid,client,contact,desc,
    type:document.getElementById('s-type')?.value||'其他',
    purpose:document.getElementById('s-purpose')?.value||'私人',
    charCount:+(document.getElementById('s-charcount')?.value)||1,
    month,budget:(document.getElementById('s-budget')?.value||'').trim(),
    due:document.getElementById('s-due')?.value||'',
    ref:(document.getElementById('s-ref')?.value||'').trim(),
    submittedAt:new Date().toISOString()};
  try{
    await dbInsert('pending_submits',localPendToDB(p));
    pendingSubmits.unshift(p);
    document.getElementById('submit-form-inner').style.display='none';
    document.getElementById('submit-success').style.display='block';
    document.getElementById('success-order-num').textContent=pid;
    buildTabs();
  }catch(e){toast('⚠️ 送出失敗，請稍後再試');console.error(e);}
}

  const pid=document.getElementById('success-order-num')?.textContent||'';

}

  wrap.style.display='block';
  document.getElementById('review-list').innerHTML=pendingSubmits.map(p=>{
    const d=new Date(p.submittedAt).toLocaleDateString('zh-TW');
    return`<div class="review-card" id="rc-${p.id}">
      <div class="rc-head">
        <div><div class="rc-name">${esc(p.client)}</div>
        <div class="rc-type">${p.type} · ${MZH[(p.month||1)-1]} · ${esc(p.contact)}</div>
        ${p.purpose?`<div style="margin-top:.18rem;">${purposeBadge(p.purpose)}</div>`:''}
        ${p.charCount?`<div style="font-size:.76rem;color:var(--muted);margin-top:.15rem;">👤 ${p.charCount} 人</div>`:''}</div>
      </div>
      <div class="rc-body">
        <div class="rc-field"><span class="lbl">委託說明</span>${esc(p.desc)}</div>
        ${p.budget?`<div class="rc-field"><span class="lbl">預算</span>${esc(p.budget)}</div>`:''}
        ${p.due?`<div class="rc-field"><span class="lbl">希望完稿</span>${p.due}</div>`:''}
        ${p.ref?`<div class="rc-field"><span class="lbl">參考圖</span><a href="${esc(p.ref)}" target="_blank">${esc(p.ref)}</a></div>`:''}
      </div>
      <div class="rc-foot">
        <span class="rc-date">投單：${d}</span>
        <div class="rc-acts">
          <button class="btn btn-sage btn-sm" onclick="acceptPending('${p.id}')">✓ 接受</button>
          <button class="btn btn-rust btn-sm" onclick="toggleReject('${p.id}')">✕ 拒絕</button>
        </div>
      </div>
      <div class="reject-box" id="rej-${p.id}">
        <textarea placeholder="拒絕原因（可留空）" id="rejreason-${p.id}"></textarea>
        <div class="reject-box-btns">
          <button class="btn btn-ghost btn-sm" onclick="toggleReject('${p.id}')">取消</button>
          <button class="btn btn-rust btn-sm" onclick="confirmReject('${p.id}')">確認拒絕</button>
        </div>
      </div>
    </div>`;
  }).join('');
}
function toggleReject(id){const el=document.getElementById('rej-'+id);el.style.display=el.style.display==='block'?'none':'block';}

async function acceptPending(pid){
  const p=pendingSubmits.find(x=>x.id===pid);if(!p)return;
  const c={id:nextId(),client:p.client,contact:p.contact,type:p.type,desc:p.desc,
    ref:p.ref||'',price:p.budget||'',month:p.month,due:p.due||'',status:'待確認',
    purpose:p.purpose||'私人',charCount:p.charCount||1,payment:'尚未付款',
    note:`投單申請 (${p.id})`,createdAt:new Date().toISOString()};
  try{
    await dbInsert('commissions',localToDB(c));
    // store mapping so client can look up by PND id
    await dbInsert('app_settings',{key:'pidmap_'+pid,value:c.id}).catch(()=>
      dbUpdate('app_settings','?key=eq.pidmap_'+pid,{value:c.id}));
    await dbDelete('pending_submits','?id=eq.'+pid);
    // persist updated counter
    await persistSettings();
    commissions.unshift(c);
    pendingSubmits=pendingSubmits.filter(x=>x.id!==pid);
    renderReview();renderQueue();renderStats();buildTabs();
    toast(`✦ 已接受 → ${c.id}`);
  }catch(e){toast('⚠️ 操作失敗');console.error(e);}
}

async function confirmReject(pid){
  const reason=(document.getElementById('rejreason-'+pid)?.value||'').trim();
  try{
    await dbInsert('rejections',{pending_id:pid,reason});
    await dbDelete('pending_submits','?id=eq.'+pid);
    pendingSubmits=pendingSubmits.filter(x=>x.id!==pid);
    renderReview();buildTabs();toast('已拒絕該申請');
  }catch(e){toast('⚠️ 操作失敗');console.error(e);}
}

// ══ STATS ══
function parsePrice(str){const m=(str||'').replace(/,/g,'').match(/\d+/);return m?parseInt(m[0],10):0;}
function renderStats(){
  const now=new Date(),cm=now.getMonth()+1;
  const act=commissions.filter(c=>!['完成','取消'].includes(c.status)).length;
  const done=commissions.filter(c=>c.status==='完成').length;
  const pend=commissions.filter(c=>c.status==='待確認').length;
  const monthPaid=commissions.filter(c=>c.month==cm&&c.payment==='已付清'&&c.status!=='取消');
  const monthTotal=monthPaid.reduce((s,c)=>s+parsePrice(c.price),0);
  document.getElementById('stats-row').innerHTML=
    `<div class="stat-box"><div class="stat-num">${act}</div><div class="stat-label">進行中</div></div>
     <div class="stat-box"><div class="stat-num">${pendingSubmits.length}</div><div class="stat-label">待審核</div></div>
     <div class="stat-box"><div class="stat-num">${pend}</div><div class="stat-label">待確認</div></div>
     <div class="stat-box"><div class="stat-num">${done}</div><div class="stat-label">已完成</div></div>
     <div class="stat-box"><div class="stat-num">${commissions.length}</div><div class="stat-label">總單數</div></div>
     <div class="stat-box" style="border-left:3px solid var(--sage);grid-column:span 2;">
       <div class="stat-num" style="font-size:1.3rem;color:var(--sage);">${monthTotal?'$'+monthTotal.toLocaleString():'—'}</div>
       <div class="stat-label">${MZH[cm-1]}已入帳（${monthPaid.length} 件）</div>
     </div>`;
}

// ══ QUEUE ══
function renderQueue(){
  const q=(document.getElementById('search-input')?.value||'').toLowerCase();
  const sf=document.getElementById('filter-status')?.value||'';
  const ORD={'待確認':0,'已確認':1,'構圖中':2,'待審構圖':3,'線稿中':4,'待審線稿':5,'上色中':6,'待審色稿':7,'完成':8,'修改中':9,'取消':10};
  const list=commissions
    .filter(c=>(!q||c.client.toLowerCase().includes(q)||c.id.toLowerCase().includes(q))&&(!sf||c.status===sf))
    .sort((a,b)=>(ORD[a.status]??9)-(ORD[b.status]??9)||b.id.localeCompare(a.id));
  const el=document.getElementById('queue-list');
  if(!list.length){el.innerHTML='<div class="empty-state">沒有符合條件的委託 ✦</div>';return;}
  el.innerHTML=list.map(c=>{
    const qp=commissions.filter(x=>!['完成','取消'].includes(x.status)).findIndex(x=>x.id===c.id);
    const pos=qp>=0?`<span class="qpos">排隊 #${qp+1}</span>`:'';
    const mon=c.month?`<span class="qpos">${MZH[c.month-1]}</span>`:'';
    const payIcon={'尚未付款':'⚪','匯款（銀行/街口/LINE Pay）':'🏦','無卡分期（綠界）':'💳','已付清':'✅'};
    const payClr={'尚未付款':'#999','匯款（銀行/街口/LINE Pay）':'var(--blue)','無卡分期（綠界）':'#9b59b6','已付清':'var(--sage)'};
    const payLabel=c.payment?`<span style="font-size:.72rem;color:${payClr[c.payment]||'#999'};">${payIcon[c.payment]||''} ${esc(c.payment)}</span>`:'';
    const ref=c.ref?`<a href="${esc(c.ref)}" target="_blank" style="color:var(--blue);font-size:.76rem;">🔗 參考圖</a>`:'';
    return`<div class="com-card" data-status="${c.status}">
      <div class="cc-head">
        <div class="cc-meta">
          <span class="onum">${c.id}</span><span class="cname">${esc(c.client)}</span>
          <span class="ctype">${c.type}${c.price?' · '+esc(c.price):''}</span>
          ${c.charCount?`<span class="qpos">👤 ${c.charCount}人</span>`:''}
          ${c.purpose?purposeBadge(c.purpose):''}${pos}${mon}
        </div>
        <span class="sbadge s${c.status}">${c.status}</span>
      </div>
      <div class="cc-body">
        ${c.desc?`<div>${esc(c.desc)}</div>`:''}
        ${c.contact?`<div style="font-size:.76rem;">聯絡：${esc(c.contact)}</div>`:''}
        ${payLabel}${ref}
        ${c.note?`<div class="cc-note">🗒 ${esc(c.note)}</div>`:''}
      </div>
      <div class="cc-foot">
        <span class="cc-date">${c.due?'📅 '+c.due:''}</span>
        <div class="cc-acts">
          <select class="isel" onchange="quickStatus('${c.id}',this.value)">
            ${ALL_STATUSES.map(s=>`<option${s===c.status?' selected':''}>${s}</option>`).join('')}
          </select>
          <button class="btn btn-sage btn-sm" onclick="openEdit('${c.id}')">編輯</button>
          <button class="btn btn-rust btn-sm" onclick="delCommission('${c.id}')">刪除</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

async function quickStatus(id,status){
  const c=commissions.find(x=>x.id===id);if(!c)return;
  const old=c.status; c.status=status;
  try{
    await dbUpdate('commissions','?id=eq.'+id,{status});
    renderQueue();renderStats();toast(`${c.id} → ${status}`);
  }catch(e){c.status=old;toast('⚠️ 更新失敗');renderQueue();}
}

// ══ SETTINGS ══
function renderSettingsPage(){
  document.getElementById('s-announcement').value=settings.announcement||'';
  document.getElementById('s-price-note').value=settings.priceNote||'';
  document.getElementById('s-contact-link').value=settings.contactLink||'';
  document.getElementById('s-contact-name').value=settings.contactName||'';
  renderDdEditor('dd-types',settings.commissionTypes,'commissionTypes');

  renderDdEditor('dd-payments',settings.paymentMethods,'paymentMethods');
  const now=new Date().getMonth()+1;
  document.getElementById('slot-settings-grid').innerHTML=Array.from({length:12},(_,i)=>i+1).map(m=>{
    const s=settings.slots[m]||{open:false,limit:2};
    const used=getUsed(m);const past=m<now;
    return`<div class="slot-month-card">
      <h4>${MZH[m-1]} ${past?'<span style="font-size:.68rem;color:var(--muted);">(已過)</span>':''}</h4>
      <div class="slot-toggle">
        <label class="switch"><input type="checkbox" id="so-${m}" ${s.open?'checked':''}><span class="slider"></span></label>
        <span class="toggle-label">開放投單</span>
      </div>
      <div class="slot-row">
        <label>稿位上限</label>
        <input type="number" id="sl-${m}" min="0" max="99" value="${s.limit||0}">
        <span style="font-size:.7rem;color:var(--muted);">（0=∞）</span>
      </div>
      <div style="font-size:.7rem;color:var(--muted);margin-top:.25rem;">已排：${used} 件</div>
    </div>`;
  }).join('');
}

function renderDdEditor(containerId,items,key){
  const el=document.getElementById(containerId);if(!el)return;
  el.innerHTML=`<ul class="dd-list" id="ddlist-${key}">
    ${items.map((v,i)=>`<li class="dd-item" draggable="true" data-i="${i}">
      <span>${esc(v)}</span>
      <button onclick="ddRemove('${key}',${i})" title="刪除">✕</button>
    </li>`).join('')}
  </ul>
  <div class="dd-add-row">
    <input type="text" id="ddinput-${key}" placeholder="新增選項…" onkeydown="if(event.key==='Enter')ddAdd('${key}')">
    <button class="btn btn-gold btn-sm" onclick="ddAdd('${key}')">＋</button>
  </div>`;
  const list=document.getElementById('ddlist-'+key);
  let dragSrc=null;
  list.querySelectorAll('.dd-item').forEach(item=>{
    item.addEventListener('dragstart',e=>{dragSrc=item;item.style.opacity='.4';});
    item.addEventListener('dragend',e=>{item.style.opacity='1';});
    item.addEventListener('dragover',e=>{e.preventDefault();});
    item.addEventListener('drop',e=>{
      e.preventDefault();if(dragSrc===item)return;
      const all=[...list.querySelectorAll('.dd-item')];
      const from=all.indexOf(dragSrc),to=all.indexOf(item);
      const arr=settings[key];arr.splice(to,0,arr.splice(from,1)[0]);
      renderDdEditor(containerId,arr,key);
    });
  });
}
function ddAdd(key){
  const inp=document.getElementById('ddinput-'+key);if(!inp)return;
  const v=inp.value.trim();if(!v)return;
  if(!settings[key].includes(v))settings[key].push(v);
  inp.value='';
  const map={commissionTypes:'dd-types',purposes:'dd-purposes',paymentMethods:'dd-payments'};
  renderDdEditor(map[key],settings[key],key);
}
function ddRemove(key,i){
  settings[key].splice(i,1);
  const map={commissionTypes:'dd-types',purposes:'dd-purposes',paymentMethods:'dd-payments'};
  renderDdEditor(map[key],settings[key],key);
}
async function saveSettings(){
  settings.announcement=document.getElementById('s-announcement').value.trim();
  settings.priceNote=document.getElementById('s-price-note').value.trim();
  settings.contactLink=document.getElementById('s-contact-link').value.trim();
  settings.contactName=document.getElementById('s-contact-name').value.trim();
  for(let m=1;m<=12;m++) settings.slots[m]={
    open:document.getElementById(`so-${m}`)?.checked||false,
    limit:+document.getElementById(`sl-${m}`)?.value||0};
  try{
    await persistSettings();
    refreshDynamicSelects();
    toast('✦ 設定已儲存');
  }catch(e){toast('⚠️ 儲存失敗');console.error(e);}
}
function resetSettings(){
  if(!confirm('確定還原預設？'))return;
  settings=mkDefaultSettings();
  renderSettingsPage();
  toast('已還原（請記得儲存）');
}

// ══ LOOKUP ══
async function doLookup(){
  const val=(document.getElementById('lookup-input').value||'').trim().toUpperCase();
  const el=document.getElementById('lookup-result');
  if(!val){el.innerHTML='';return;}

  if(val.startsWith('PND-')){
    // check mapping
    try{
      const rows=await dbGet('app_settings','?key=eq.pidmap_'+val);
      if(rows&&rows.length){
        const comId=rows[0].value;
        const coms=await dbGet('commissions','?id=eq.'+comId);
        if(coms&&coms.length){renderResult(el,dbToLocal(coms[0]));return;}
      }
      // check rejections
      const rejs=await dbGet('rejections','?pending_id=eq.'+val);
      if(rejs&&rejs.length){
        const r=rejs[0];
        el.innerHTML=`<div class="result-card" style="text-align:center;padding:1.6rem;">
          <div style="font-size:1.8rem;margin-bottom:.45rem;">😔</div>
          <p style="font-weight:600;margin-bottom:.25rem;">申請未通過審核</p>
          <p style="color:var(--muted);font-size:.82rem;">${r.reason?'原因：'+esc(r.reason):'如有疑問請私訊繪師。'}</p>
        </div>`;return;
      }
      // check still pending
      const pends=await dbGet('pending_submits','?id=eq.'+val);
      if(pends&&pends.length){
        el.innerHTML=`<div class="result-card" style="text-align:center;padding:1.6rem;">
          <div style="font-size:1.8rem;margin-bottom:.45rem;">⏳</div>
          <p style="font-weight:600;margin-bottom:.25rem;">申請審核中</p>
          <p style="color:var(--muted);font-size:.82rem;">您的申請 <strong>${val}</strong> 正在等待繪師審核，請稍後再查詢。</p>
        </div>`;return;
      }
    }catch(e){console.error(e);}
  }

  try{
    const coms=await dbGet('commissions','?id=eq.'+val);
    if(coms&&coms.length){renderResult(el,dbToLocal(coms[0]));return;}
  }catch(e){console.error(e);}

  el.innerHTML=`<div class="result-card" style="text-align:center;padding:1.6rem;">
    <div style="font-size:1.8rem;margin-bottom:.45rem;">🔍</div>
    <p style="color:var(--muted);">找不到編號 <strong>${val}</strong><br>請確認格式（COM-0001 或 PND-…）</p>
  </div>`;
}

function renderResult(el,c){
  const cancelled=c.status==='取消';
  const ci=STATUS_STEPS.indexOf(c.status);
  const steps=STATUS_STEPS.map((s,i)=>{
    const cls=cancelled?'':i<ci?'done':i===ci?'curr':'';
    const dot=cls==='done'?'✓':cls==='curr'?'●':'';
    return`<div class="step ${cls}"><div class="sdot">${dot}</div><div class="slabel">${s}</div></div>`;
  }).join('');
  const mon=c.month?MZH[c.month-1]:'—';
  el.innerHTML=`<div class="result-card">
    <div class="res-head">
      <div><div class="res-order">${c.id}</div>
      <div style="font-size:.8rem;color:var(--muted);">${esc(c.client)} · ${c.type} · ${mon}</div>
      ${c.purpose?`<div style="margin-top:.2rem;">${purposeBadge(c.purpose)}</div>`:''}</div>
      <span class="sbadge s${c.status}">${c.status}</span>
    </div>
    ${cancelled?'<p style="color:var(--rust);font-size:.83rem;font-weight:600;margin-bottom:.45rem;">✕ 此委託已取消</p>':''}
    <div class="prog-steps">${steps}</div>
    <dl class="res-dl">
      ${c.desc?`<dt>委託內容</dt><dd>${esc(c.desc)}</dd>`:''}
      ${c.due?`<dt>預計完成</dt><dd>📅 ${c.due}</dd>`:''}
      <dt>建立日期</dt><dd>${new Date(c.createdAt).toLocaleDateString('zh-TW')}</dd>
    </dl>
  </div>`;
}

// ══ DYNAMIC SELECTS ══
function opts(items,selected=''){return items.map(v=>`<option${v===selected?' selected':''}>${esc(v)}</option>`).join('');}
function refreshDynamicSelects(){
  const map={'f-type':settings.commissionTypes,'f-purpose':settings.purposes,'f-payment':settings.paymentMethods,
    'edit-type':settings.commissionTypes,'edit-purpose':settings.purposes,'edit-payment':settings.paymentMethods};
  Object.entries(map).forEach(([id,items])=>{
    const el=document.getElementById(id);if(!el)return;
    const cur=el.value;el.innerHTML=opts(items);if(items.includes(cur))el.value=cur;
  });
}

// ══ UTILS ══
function purposeBadge(p){
  const map={'🔒 私人':{bg:'#e8f4fd',color:'#1e6091'},'📦 製品':{bg:'#fef9e7',color:'#9a6a00'},'💼 商業':{bg:'#fdf2f8',color:'#8e1a5e'}};
  const s=map[p]||{bg:'#eee',color:'#666'};
  return`<span style="display:inline-block;background:${s.bg};color:${s.color};font-size:.68rem;padding:.1rem .5rem;border-radius:20px;font-weight:600;">${esc(p)}</span>`;
}
function closeModal(id){document.getElementById(id).classList.remove('open');}
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function toast(msg){
  const el=document.createElement('div');el.className='toast';el.textContent=msg;
  document.body.appendChild(el);
  setTimeout(()=>{el.classList.add('hide');setTimeout(()=>el.remove(),350);},2800);
}

// ══ INIT ══
async function init(){
  buildTabs();
  await loadSettings();
  await loadAll();
  refreshDynamicSelects();
  renderSubmitPage();
  if(isAdmin){renderQueue();renderStats();renderReview();}
}
init();

document.getElementById('pw-modal').addEventListener('click',e=>{if(e.target===document.getElementById('pw-modal'))closeModal('pw-modal');});
document.getElementById('lookup-input').addEventListener('keydown',e=>{if(e.key==='Enter')doLookup();});
</script>
