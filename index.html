<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>bynon.art 委託排單</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400&family=Noto+Sans+TC:wght@300;400;500&family=Noto+Serif+TC:wght@300;400&display=swap" rel="stylesheet">
<style>
/* ============ 文青簡約・紫 ============
   想換顏色只要改這一區的變數就好 */
:root{
  --ink:#3A3244;          /* 主文字：深灰紫 */
  --paper:#F7F4FA;        /* 頁面底：帶紫的米白 */
  --mist:#EFEAF5;         /* 淡紫底（輸入區、標籤） */
  --accent:#7A68A0;       /* 主色：灰調薰衣草紫 */
  --accent-deep:#5F4E86;  /* 深紫：連結、強調字 */
  --accent-soft:#B7A9D3;  /* 淡紫：細節、外框 */
  --rose:#B0566C;         /* 警示：灰玫瑰 */
  --sage:#6F9282;         /* 完成：灰綠 */
  --amber:#A9803F;        /* 提醒：低調赭色 */
  --muted:#6F677C;        /* 次要文字 */
  --border:#E3DCEA;       /* 細線 */
  --shadow:rgba(90,70,130,.08);
  --link:#5F4E86;
  --serif:'Noto Serif TC',serif;
  --sans:'Noto Sans TC',sans-serif;
  --latin:'Cormorant Garamond','Noto Serif TC',serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-weight:400;line-height:1.7;
  letter-spacing:.02em;min-height:100vh;-webkit-font-smoothing:antialiased;}
button,input,select,textarea{font-family:var(--sans);}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

/* ---------- Header ---------- */
header{max-width:860px;margin:0 auto;padding:2.6rem 1rem 1.4rem;display:flex;align-items:flex-end;
  justify-content:space-between;gap:1rem;flex-wrap:wrap;}
.hbrand h1{font-family:var(--serif);font-size:clamp(1.25rem,3.2vw,1.6rem);font-weight:300;letter-spacing:.14em;line-height:1.3;}
.hbrand h1 em{font-family:var(--latin);font-style:italic;font-weight:500;font-size:1.25em;letter-spacing:.04em;margin-right:.35rem;}
.hbrand p{font-family:var(--latin);font-style:italic;font-size:.95rem;color:var(--muted);letter-spacing:.08em;margin-top:.1rem;}
.header-right{display:flex;align-items:center;gap:.6rem;flex-shrink:0;}
.admin-btn{background:transparent;border:1px solid var(--border);color:var(--muted);padding:.32rem .95rem;
  border-radius:20px;font-size:.76rem;letter-spacing:.08em;cursor:pointer;transition:all .2s;}
.admin-btn:hover{border-color:var(--accent);color:var(--accent-deep);}
.admin-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.logout-btn{background:transparent;border:none;color:var(--muted);font-size:.72rem;cursor:pointer;padding:.2rem .35rem;}
.logout-btn:hover{color:var(--rose);}
.admin-label{font-size:.72rem;color:var(--accent-deep);letter-spacing:.1em;}

/* ---------- Tabs ---------- */
.nav-tabs{display:flex;max-width:860px;margin:0 auto;padding:0 1rem;border-bottom:1px solid var(--border);overflow-x:auto;gap:.2rem;}
.nav-tab{min-width:max-content;padding:.7rem 1rem;border:none;background:transparent;font-size:.84rem;letter-spacing:.1em;
  color:var(--muted);cursor:pointer;transition:color .2s,border-color .2s;border-bottom:2px solid transparent;margin-bottom:-1px;}
.nav-tab.active{color:var(--accent-deep);border-bottom-color:var(--accent);font-weight:500;}
.nav-tab:hover:not(.active){color:var(--ink);}
.tab-badge{display:inline-flex;align-items:center;justify-content:center;background:var(--accent);color:#fff;
  font-size:.6rem;font-weight:500;width:15px;height:15px;border-radius:50%;margin-left:4px;vertical-align:middle;}
main{max-width:860px;margin:0 auto;padding:2rem 1rem 4rem;}
.panel{display:none;}.panel.active{display:block;animation:fadeUp .35s ease;}
@keyframes fadeUp{from{opacity:0}to{opacity:1}}

/* ---------- Titles ---------- */
.sec-title{font-family:var(--serif);font-size:1.05rem;font-weight:400;letter-spacing:.1em;color:var(--ink);
  margin-bottom:1.1rem;padding-bottom:.55rem;border-bottom:1px solid var(--border);display:flex;align-items:baseline;gap:.5rem;}
.sec-title .icon{display:none;}

/* ---------- Forms ---------- */
.form-card{background:#fff;border:1px solid var(--border);border-radius:6px;padding:1.6rem;margin-bottom:1.6rem;box-shadow:0 1px 3px var(--shadow);}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;}
.fg{display:flex;flex-direction:column;gap:.32rem;}
.fg.full{grid-column:1/-1;}
label{font-size:.76rem;color:var(--muted);letter-spacing:.06em;}
label .req{color:var(--rose);}
input,select,textarea{border:1px solid var(--border);border-radius:4px;padding:.58rem .75rem;font-size:.88rem;
  color:var(--ink);background:#fff;transition:border-color .2s,box-shadow .2s;width:100%;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(122,104,160,.14);}
input::placeholder,textarea::placeholder{color:#A9A2B5;}
textarea{resize:vertical;min-height:80px;}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:.35rem;padding:.55rem 1.25rem;border:none;border-radius:4px;
  font-size:.84rem;letter-spacing:.08em;cursor:pointer;transition:background .18s,color .18s,border-color .18s;}
.btn-primary{background:var(--accent);color:#fff;font-weight:500;}
.btn-primary:hover{background:var(--accent-deep);}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--muted);}
.btn-ghost:hover{background:var(--mist);color:var(--ink);}
.btn-sage{background:var(--sage);color:#fff;}
.btn-sage:hover{background:#5D7F6F;}
.btn-rust{background:transparent;color:var(--rose);border:1px solid var(--rose);}
.btn-rust:hover{background:var(--rose);color:#fff;}
.btn-sm{padding:.24rem .65rem;font-size:.74rem;}
.btn-full{width:100%;justify-content:center;padding:.72rem;font-size:.9rem;}

/* ---------- Modal ---------- */
.modal{background:var(--paper);border:1px solid var(--border);border-radius:8px;padding:1.6rem;width:100%;max-width:500px;
  box-shadow:0 12px 40px rgba(58,50,68,.18);animation:fadeUp .25s ease;display:flex;flex-direction:column;max-height:90vh;}
.modal h3{font-family:var(--serif);font-weight:400;letter-spacing:.1em;font-size:1.08rem;margin-bottom:.9rem;flex-shrink:0;}
.modal-body{overflow-y:auto;flex:1;padding-right:.25rem;}
.mfoot{display:flex;justify-content:flex-end;gap:.45rem;margin-top:1rem;flex-shrink:0;padding-top:.8rem;border-top:1px solid var(--border);}
.modal-ov{display:none;position:fixed;inset:0;background:rgba(58,50,68,.45);z-index:200;align-items:center;justify-content:center;padding:1rem;}
.modal-ov.open{display:flex;}
.pw-modal{max-width:320px;text-align:center;}
.pw-modal .lock{display:none;}
.pw-modal input{text-align:center;letter-spacing:.12em;font-size:.95rem;}
.pw-err{color:var(--rose);font-size:.78rem;margin-top:.35rem;min-height:1.1rem;}

/* ---------- Stats ---------- */
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(95px,1fr));gap:.7rem;margin-bottom:1.4rem;}
.stat-box{background:#fff;border:1px solid var(--border);border-radius:6px;padding:.8rem .9rem;text-align:center;}
.stat-num{font-family:var(--latin);font-weight:500;font-size:1.7rem;color:var(--accent-deep);line-height:1.1;}
.stat-label{font-size:.68rem;color:var(--muted);margin-top:.12rem;letter-spacing:.06em;}

/* ---------- Review ---------- */
.review-wrap{background:#F1ECF8;border:1px solid #DDD2EC;border-radius:6px;padding:1.2rem;margin-bottom:1.6rem;}
.review-wrap .sec-title{border-bottom-color:#DDD2EC;font-size:1rem;}
.review-card{background:#fff;border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:4px;
  padding:.9rem 1.1rem;margin-bottom:.6rem;animation:fadeUp .25s ease;}
.review-card:last-child{margin-bottom:0;}
.rc-head{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:.4rem;}
.rc-name{font-weight:500;font-size:.92rem;}.rc-type{font-size:.76rem;color:var(--muted);}
.rc-body{margin:.5rem 0;font-size:.83rem;line-height:1.75;}
.rc-field{margin-bottom:.25rem;}.rc-field .lbl{color:var(--muted);font-size:.72rem;display:block;letter-spacing:.06em;}
.rc-field a{color:var(--link);font-size:.82rem;word-break:break-all;}
.rc-foot{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.35rem;margin-top:.55rem;}
.rc-date{font-size:.7rem;color:var(--muted);}.rc-acts{display:flex;gap:.3rem;align-items:center;}
.reject-box{display:none;margin-top:.45rem;}.reject-box textarea{min-height:45px;}
.reject-box-btns{display:flex;gap:.3rem;justify-content:flex-end;margin-top:.3rem;}

/* ---------- Queue ---------- */
.q-controls{display:flex;gap:.65rem;margin-bottom:.9rem;flex-wrap:wrap;align-items:center;}
.q-controls input{flex:1;min-width:140px;max-width:250px;}
.q-list{display:flex;flex-direction:column;gap:.7rem;}
.com-card{background:#fff;border:1px solid var(--border);border-left:3px solid var(--border);border-radius:6px;
  padding:.95rem 1.15rem;transition:box-shadow .2s;}
.com-card:hover{box-shadow:0 2px 12px var(--shadow);}
.com-card.dragging{opacity:.45;box-shadow:0 6px 20px var(--shadow);}
.com-card.drag-over{border-top:2px solid var(--accent);}
.drag-handle{cursor:grab;color:var(--accent-soft);font-size:.9rem;padding:.1rem .3rem;flex-shrink:0;}
.drag-handle:hover{color:var(--accent-deep);}
.com-card[data-status="待確認"]{border-left-color:#C9C4D1;}
.com-card[data-status="已確認"]{border-left-color:#8C9BCB;}
.com-card[data-status="構圖中"]{border-left-color:#A897C8;}
.com-card[data-status="待審構圖"]{border-left-color:#8570B0;}
.com-card[data-status="線稿中"]{border-left-color:#B58AB3;}
.com-card[data-status="待審線稿"]{border-left-color:#9C5EA0;}
.com-card[data-status="上色中"]{border-left-color:#C4809F;}
.com-card[data-status="待審色稿"]{border-left-color:#A4507A;}
.com-card[data-status="修改中"]{border-left-color:var(--rose);}
.com-card[data-status="完成"]{border-left-color:var(--sage);}
.com-card[data-status="取消"]{border-left-color:#C9C4D1;opacity:.65;}
.cc-head{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:.45rem;}
.cc-meta{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap;}
.onum{font-family:var(--latin);font-size:1rem;font-weight:500;color:var(--accent-deep);letter-spacing:.08em;}
.cname{font-weight:500;font-size:.92rem;}.ctype{font-size:.76rem;color:var(--muted);}
.sbadge{display:inline-block;padding:.14rem .65rem;border-radius:20px;font-size:.7rem;font-weight:500;letter-spacing:.06em;white-space:nowrap;}
.s待確認{background:#EEECF0;color:#5F5969;}.s已確認{background:#E3E8F5;color:#3D4F87;}
.s構圖中{background:#ECE6F5;color:#5F4E86;}.s待審構圖{background:#E2D8F0;color:#4B3B73;}
.s線稿中{background:#F1E6F0;color:#7A4A78;}.s待審線稿{background:#EAD5EA;color:#64336A;}
.s上色中{background:#F6E4EC;color:#8A3F63;}.s待審色稿{background:#EFD3E0;color:#6E2B4D;}
.s完成{background:#E0EEE6;color:#3E6B55;}.s修改中{background:#F5DDE0;color:#93424F;}
.s取消{background:#F0EFF2;color:#6F6A78;}
.cc-body{margin-top:.5rem;font-size:.83rem;color:var(--muted);line-height:1.7;}
.cc-note{font-size:.78rem;color:var(--ink);margin-top:.25rem;font-style:italic;}
.cc-foot{margin-top:.65rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.4rem;}
.cc-date{font-size:.72rem;color:var(--muted);}.cc-acts{display:flex;gap:.32rem;flex-wrap:wrap;}
.isel{border:1px solid var(--border);border-radius:4px;padding:.22rem .4rem;font-size:.74rem;color:var(--ink);background:#fff;cursor:pointer;width:auto;}
.qpos{display:inline-block;background:var(--mist);color:var(--accent-deep);font-size:.7rem;padding:.06rem .5rem;
  border-radius:20px;font-family:var(--latin);font-weight:500;}

/* ---------- Settings ---------- */
.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem;}
.slot-month-card{background:#fff;border:1px solid var(--border);border-radius:6px;padding:1rem 1.1rem;}
.slot-month-card h4{font-family:var(--serif);font-weight:400;letter-spacing:.08em;font-size:.94rem;color:var(--ink);margin-bottom:.65rem;}
.slot-row{display:flex;align-items:center;gap:.45rem;margin-bottom:.4rem;}
.slot-row label{font-size:.76rem;color:var(--muted);min-width:65px;letter-spacing:0;}
.slot-row input[type=number]{width:62px;text-align:center;}
.slot-toggle{display:flex;align-items:center;gap:.4rem;margin-bottom:.5rem;}
.toggle-label{font-size:.76rem;color:var(--muted);}
.switch{position:relative;display:inline-block;width:34px;height:19px;}
.switch input{opacity:0;width:0;height:0;}
.slider{position:absolute;cursor:pointer;inset:0;background:#D8D1E2;border-radius:20px;transition:.3s;}
.slider:before{position:absolute;content:'';height:13px;width:13px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.3s;}
input:checked+.slider{background:var(--accent);}
input:checked+.slider:before{transform:translateX(15px);}
.settings-save-row{display:flex;justify-content:flex-end;gap:.45rem;margin-top:.4rem;}
.dd-editor{margin-bottom:.5rem;}
.dd-list{list-style:none;display:flex;flex-direction:column;gap:.3rem;margin-bottom:.5rem;}
.dd-item{display:flex;align-items:center;gap:.4rem;background:var(--mist);border:1px solid var(--border);border-radius:4px;padding:.3rem .55rem;}
.dd-item span{flex:1;font-size:.84rem;}
.dd-item button{background:none;border:none;cursor:pointer;font-size:.85rem;color:var(--muted);padding:.1rem .2rem;}
.dd-item button:hover{color:var(--rose);}
.dd-add-row{display:flex;gap:.4rem;}.dd-add-row input{flex:1;font-size:.84rem;}
.dd-section-title{font-size:.8rem;color:var(--muted);letter-spacing:.06em;margin-bottom:.4rem;}

/* ---------- Public: 投單 ---------- */
.slots-public{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:.7rem;margin-bottom:1.5rem;}
.slot-pub-card{background:#fff;border:1px solid var(--border);border-radius:6px;padding:.9rem;text-align:center;}
.slot-month-name{font-family:var(--serif);font-size:.95rem;letter-spacing:.08em;color:var(--ink);margin-bottom:.25rem;}
.slot-remain{font-size:1.6rem;font-family:var(--latin);font-weight:500;line-height:1.2;}
.slot-remain.ok{color:var(--sage);}.slot-remain.low{color:var(--amber);}.slot-remain.none{color:var(--rose);}
.slot-sublabel{font-size:.68rem;color:var(--muted);margin-top:.08rem;}
.submit-wrap{background:#fff;border:1px solid var(--border);border-radius:8px;padding:2rem 1.75rem;box-shadow:0 2px 16px var(--shadow);}
.submit-intro{text-align:center;margin-bottom:1.5rem;padding-bottom:1.25rem;border-bottom:1px solid var(--border);}
.submit-intro .di{display:none;}
.submit-intro h2{font-family:var(--serif);font-weight:300;font-size:1.35rem;letter-spacing:.16em;margin-bottom:.4rem;}
.submit-intro p{font-size:.83rem;color:var(--muted);line-height:1.8;}
.price-notice{background:var(--mist);border-left:2px solid var(--accent);border-radius:4px;padding:.6rem .9rem;margin-bottom:1.1rem;
  font-size:.83rem;color:var(--ink);line-height:1.7;}
.price-notice strong{color:var(--accent-deep);font-weight:500;}
.closed-wall{text-align:center;padding:2.5rem 1rem;}
.closed-wall .cw-icon{display:none;}
.closed-wall h3{font-family:var(--serif);font-weight:300;letter-spacing:.14em;font-size:1.25rem;margin-bottom:.5rem;}
.closed-wall p{color:var(--muted);font-size:.85rem;line-height:1.8;}
.success-box{display:none;text-align:center;padding:2rem 1rem;}
.success-box .si{display:none;}
.success-box h3{font-family:var(--serif);font-weight:300;letter-spacing:.14em;font-size:1.25rem;margin-bottom:.4rem;}
.success-box p{color:var(--muted);font-size:.83rem;line-height:1.8;}
.order-reveal{display:inline-block;margin:1.1rem auto 0;background:var(--mist);color:var(--accent-deep);border:1px solid var(--accent-soft);
  font-family:var(--latin);font-size:1.3rem;font-weight:500;padding:.4rem 1.5rem;border-radius:4px;letter-spacing:.2em;}

/* ---------- Public: 查詢 ---------- */
.lookup-box{background:#fff;border:1px solid var(--border);border-radius:8px;padding:1.9rem 1.75rem;max-width:480px;margin:0 auto 1.65rem;
  box-shadow:0 2px 16px var(--shadow);text-align:center;}
.lookup-box .di{display:none;}
.lookup-box h2{font-family:var(--serif);font-weight:300;letter-spacing:.14em;font-size:1.2rem;margin-bottom:.4rem;}
.lookup-box p{font-size:.8rem;color:var(--muted);margin-bottom:1.05rem;}
.lookup-fields{display:flex;flex-direction:column;gap:.7rem;text-align:left;margin-bottom:1rem;}
.lookup-row{display:flex;gap:.42rem;}
.lookup-row input{flex:1;}
.result-card{background:#fff;border:1px solid var(--border);border-radius:8px;padding:1.5rem;max-width:480px;margin:0 auto;
  box-shadow:0 2px 16px var(--shadow);animation:fadeUp .3s ease;}
.res-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:.9rem;flex-wrap:wrap;gap:.45rem;}
.res-order{font-family:var(--latin);font-size:1.15rem;color:var(--accent-deep);font-weight:500;letter-spacing:.1em;}
.prog-steps{display:flex;gap:0;margin:1.1rem 0;overflow-x:auto;padding-bottom:.2rem;}
.step{flex:1;text-align:center;position:relative;min-width:50px;}
.step::before{content:'';position:absolute;top:10px;left:50%;right:-50%;height:1px;background:var(--border);z-index:0;}
.step:last-child::before{display:none;}
.sdot{width:22px;height:22px;border-radius:50%;background:var(--mist);border:1px solid var(--accent-soft);margin:0 auto .3rem;
  display:flex;align-items:center;justify-content:center;font-size:.58rem;position:relative;z-index:1;transition:all .3s;}
.step.done .sdot{background:var(--accent-soft);border-color:var(--accent-soft);color:#fff;}
.step.curr .sdot{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 0 0 4px rgba(122,104,160,.18);}
.slabel{font-size:.64rem;color:var(--muted);line-height:1.3;}
.step.done .slabel,.step.curr .slabel{color:var(--ink);}
.res-dl{font-size:.84rem;line-height:1.8;}
.res-dl dt{color:var(--muted);font-size:.72rem;letter-spacing:.06em;}
.res-dl dd{color:var(--ink);margin-bottom:.35rem;}

/* ---------- Misc ---------- */
.toast{position:fixed;bottom:1.4rem;right:1.4rem;background:var(--ink);color:var(--paper);padding:.65rem 1.1rem;border-radius:4px;
  font-size:.82rem;border-left:3px solid var(--accent-soft);box-shadow:0 4px 16px rgba(58,50,68,.25);z-index:999;animation:slideIn .3s ease;max-width:260px;}
.toast.hide{animation:slideOut .3s ease forwards;}
@keyframes slideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
@keyframes slideOut{from{opacity:1;transform:translateX(0)}to{opacity:0;transform:translateX(20px)}}
.empty-state{text-align:center;padding:2.5rem 1rem;color:var(--muted);font-style:italic;}
.loading{text-align:center;padding:2rem;color:var(--muted);font-size:.85rem;}
.ref-toggle{display:flex;gap:.5rem;margin-bottom:.4rem;}
.ref-opt{flex:1;padding:.45rem;border:1px solid var(--border);border-radius:4px;background:#fff;font-size:.8rem;color:var(--muted);
  cursor:pointer;text-align:center;transition:all .18s;}
.ref-opt.active{background:var(--accent);color:#fff;border-color:var(--accent);}

@media(max-width:520px){
  .fgrid,.settings-grid{grid-template-columns:1fr;}.fg.full{grid-column:1;}
  header{flex-direction:column;align-items:flex-start;padding-top:2rem;}
  .modal{max-height:85vh;}
  .submit-wrap,.lookup-box{padding:1.5rem 1.15rem;}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>
<body>

<header>
  <div class="hbrand">
    <h1><em>bynon.art</em>委託排單</h1>
    <p>Commission Queue System</p>
  </div>
  <div class="header-right">
    <span class="admin-label" id="admin-label" style="display:none;">管理員模式</span>
    <button class="logout-btn" id="logout-btn" style="display:none;" onclick="logout()">登出</button>
    <button class="admin-btn" id="admin-btn" onclick="openPwModal()">管理員</button>
  </div>
</header>

<div class="nav-tabs" id="nav-tabs"></div>

<main>
  <!-- PUBLIC: 投單 -->
  <div class="panel active" id="panel-submit">
    <div id="submit-slots-row"></div>

<script>
// ══ SUPABASE CONFIG ══
const SB_URL = 'https://xsjarqmrwcpthkvamgbu.supabase.co';
const SB_KEY = 'sb_publishable_eYrR1G1vAEezXNiaoYkWiA_1qLxSa1p';
const ADMIN_PW = 'draw2024'; // ← 改這裡換密碼

const STATUS_STEPS = ['待確認','已確認','構圖中','待審構圖','線稿中','待審線稿','上色中','待審色稿','完成'];
const ALL_STATUSES = [...STATUS_STEPS,'修改中','取消'];
const MZH = ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];

let isAdmin=false, commissions=[], pendingSubmits=[];
let settings = mkDefaultSettings();

function mkDefaultSettings(){
  const now=new Date(), cm=now.getMonth()+1;
  const slots={};
  for(let m=1;m<=12;m++) slots[m]={open:m===cm||m===cm+1,limit:2};
  return{
    announcement:'目前開放委託，底價 2000 起，有特殊需求歡迎私訊討論 ♡',
    priceNote:'底價 $2,000 NTD 起，複雜度另計',
    contactLink:'',contactName:'私訊',slots,
    commissionTypes:['半身圖','全身圖','大頭貼','完整插畫','Q版','表情包','其他'],
    purposes:['🔒 私人','📦 製品','💼 商業'],
    paymentMethods:['尚未付款','匯款（銀行/街口/LINE Pay）','無卡分期（綠界）','已付清'],
    idCounter:0,
    sortOrder:[], // FIX 5: custom sort order
  };
}

// ══ SUPABASE ══
async function sb(table,method='GET',body=null,query=''){
  const url=`${SB_URL}/rest/v1/${table}${query}`;
  const headers={'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,'Prefer':'return=representation'};
  const res=await fetch(url,{method,headers,body:body?JSON.stringify(body):null});
  if(!res.ok){const e=await res.text();throw new Error(e);}
  const txt=await res.text();return txt?JSON.parse(txt):null;
}
const dbGet    = (t,q='')   => sb(t,'GET',null,q);
const dbInsert = (t,b)      => sb(t,'POST',b);
const dbUpdate = (t,q,b)    => sb(t,'PATCH',b,q);
const dbDelete = (t,q)      => sb(t,'DELETE',null,q);

// FIX 1: correct upsert — use ON CONFLICT via Prefer header
async function dbUpsert(table, body){
  const url=`${SB_URL}/rest/v1/${table}`;
  const headers={'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY,
    'Prefer':'resolution=merge-duplicates,return=representation'};
  const res=await fetch(url,{method:'POST',headers,body:JSON.stringify(body)});
  if(!res.ok){const e=await res.text();throw new Error(e);}
  const txt=await res.text();return txt?JSON.parse(txt):null;
}

// ══ SETTINGS ══
async function loadSettings(){
  try{
    const rows=await dbGet('app_settings');
    if(rows&&rows.length){
      const SETTING_KEYS=['announcement','priceNote','contactLink','contactName',
        'slots','commissionTypes','purposes','paymentMethods','idCounter','sortOrder'];
      rows.forEach(r=>{
        // only merge known setting keys, skip pidmap_ and other operational keys
        if(!SETTING_KEYS.includes(r.key)) return;
        try{
          // Supabase returns jsonb as already-parsed JS values
          settings[r.key] = r.value;
        }catch(e){}
      });
      // fix slots keys to numbers
      if(settings.slots){
        const fixed={};
        Object.entries(settings.slots).forEach(([k,v])=>fixed[+k]=v);
        settings.slots=fixed;
        for(let m=1;m<=12;m++) if(!settings.slots[m]) settings.slots[m]={open:false,limit:2};
      }
      if(!Array.isArray(settings.sortOrder)) settings.sortOrder=[];
      if(!Array.isArray(settings.commissionTypes)) settings.commissionTypes=mkDefaultSettings().commissionTypes;
      if(!Array.isArray(settings.purposes)) settings.purposes=mkDefaultSettings().purposes;
      if(!Array.isArray(settings.paymentMethods)) settings.paymentMethods=mkDefaultSettings().paymentMethods;
      settings.idCounter=parseInt(settings.idCounter)||0;
    }
  }catch(e){console.warn('loadSettings',e);}
}

async function persistSettings(){
  const keys=['announcement','priceNote','contactLink','contactName','slots',
    'commissionTypes','purposes','paymentMethods','idCounter','sortOrder'];
  // save one by one to avoid batch issues
  for(const key of keys){
    try{
      await dbUpsert('app_settings',[{key, value: settings[key]}]);
    }catch(e){console.warn('persist error for key:',key,e);}
  }
}

// ══ ID ══
function nextId(){
  settings.idCounter=(settings.idCounter||0)+1;
  return 'COM-'+String(settings.idCounter).padStart(4,'0');
}

// ══ LOAD ══
async function loadAll(){
  try{
    const [coms,pends]=await Promise.all([
      dbGet('commissions','?order=created_at.desc'),
      dbGet('pending_submits','?order=submitted_at.desc'),
    ]);
    commissions=(coms||[]).map(dbToLocal);
    pendingSubmits=(pends||[]).map(dbPendToLocal);
    // apply custom sort order
    applySortOrder();
  }catch(e){console.error('loadAll',e);toast('⚠️ 資料載入失敗，請檢查網路');}
}

// FIX 5: sort order
function applySortOrder(){
  if(!settings.sortOrder||!settings.sortOrder.length) return;
  const order=settings.sortOrder;
  commissions.sort((a,b)=>{
    const ai=order.indexOf(a.id), bi=order.indexOf(b.id);
    if(ai===-1&&bi===-1) return 0;
    if(ai===-1) return 1;
    if(bi===-1) return -1;
    return ai-bi;
  });
}
async function saveSortOrder(){
  settings.sortOrder=commissions.map(c=>c.id);
  try{ await dbUpsert('app_settings',[{key:'sortOrder',value:settings.sortOrder}]); }
  catch(e){console.warn('saveSortOrder',e);}
}

// ══ MAPPING ══
function dbToLocal(r){
  return{id:r.id,client:r.client,contact:r.contact||'',type:r.type||'',
    purpose:r.purpose||'',charCount:r.char_count||1,price:r.price||'',
    payment:r.payment||'尚未付款',month:r.month||null,due:r.due||'',
    status:r.status||'待確認',ref:r.ref||'',desc:r.description||'',
    note:r.note||'',createdAt:r.created_at};
}
function localToDB(c){
  return{id:c.id,client:c.client,contact:c.contact,type:c.type,
    purpose:c.purpose,char_count:c.charCount||1,price:c.price,
    payment:c.payment,month:c.month||null,due:c.due||null,
    status:c.status,ref:c.ref,description:c.desc,note:c.note};
}
function dbPendToLocal(r){
  return{id:r.id,client:r.client,contact:r.contact||'',type:r.type||'',
    purpose:r.purpose||'',charCount:r.char_count||1,month:r.month,
    budget:r.budget||'',due:r.due||'',ref:r.ref||'',
    desc:r.description||'',submittedAt:r.submitted_at};
}
function localPendToDB(p){
  return{id:p.id,client:p.client,contact:p.contact,type:p.type,
    purpose:p.purpose,char_count:p.charCount||1,month:p.month,
    budget:p.budget,due:p.due||null,ref:p.ref,description:p.desc};
}

// ══ REF TOGGLE (FIX 2) ══

function buildTabs(){

// ══ SLOTS ══
function getUsed(m){return commissions.filter(c=>c.month==m&&c.status!=='取消').length;}
function getAvail(m){
  const s=settings.slots[m];if(!s||!s.open)return null;
  return s.limit?Math.max(0,s.limit-getUsed(m)):Infinity;
}
function hasOpenSlot(){return Object.keys(settings.slots).some(m=>{const a=getAvail(+m);return a===Infinity||a>0;});}

// ══ SUBMIT PAGE ══
function renderSubmitPage(){
  const openMs=Object.entries(settings.slots).filter(([,s])=>s.open).map(([m])=>+m);
  let slotsHtml='';
  if(openMs.length){
    slotsHtml='<div class="slots-public">'+openMs.map(m=>{
      const a=getAvail(m),lim=settings.slots[m].limit;
      let cls='ok',txt,sub;
      if(a===Infinity){txt='∞';sub='無上限';}
      else if(a===0){txt='滿';sub='已額滿';cls='none';}
      else if(a===1){txt=a;sub=`剩 ${a}/${lim} 格`;cls='low';}
      else{txt=a;sub=`剩 ${a}/${lim} 格`;}
      return`<div class="slot-pub-card"><div class="slot-month-name">${MZH[m-1]}</div>
        <div class="slot-remain ${cls}">${txt}</div><div class="slot-sublabel">${sub}</div></div>`;
    }).join('')+'</div>';
  }
  document.getElementById('submit-slots-row').innerHTML=slotsHtml;

  if(!hasOpenSlot()){
    document.getElementById('submit-body').innerHTML=`<div class="submit-wrap"><div class="closed-wall">
      <span class="cw-icon">🎨</span><h3>目前委託已額滿</h3>
      <p>所有稿位暫時已滿或未開放，請稍後再回來查看 ♡<br>
      ${settings.contactLink?`急需可 <a href="${esc(settings.contactLink)}" target="_blank" style="color:var(--link);">${esc(settings.contactName||'私訊')}</a> 詢問`:''}</p>
      </div></div>`;
    return;

async function submitCommission(){
  const client=(document.getElementById('s-client')?.value||'').trim();
  const contact=(document.getElementById('s-contact')?.value||'').trim();
  const desc=(document.getElementById('s-desc')?.value||'').trim();
  const month=+(document.getElementById('s-month')?.value||0);
  if(!client||!contact||!desc){toast('請填寫必填欄位 *');return;}
  const avail=getAvail(month);
  if(avail!==Infinity&&avail<=0){toast('抱歉，該月份已額滿！');renderSubmitPage();return;}
  const pid='PND-'+Date.now();
  const p={id:pid,client,contact,desc,
    type:document.getElementById('s-type')?.value||'其他',
    purpose:document.getElementById('s-purpose')?.value||'私人',
    charCount:+(document.getElementById('s-charcount')?.value)||1,
    month,budget:(document.getElementById('s-budget')?.value||'').trim(),
    due:document.getElementById('s-due')?.value||'',
    ref:getRef('s'),submittedAt:new Date().toISOString()};
  try{
    await dbInsert('pending_submits',localPendToDB(p));
    pendingSubmits.unshift(p);
    document.getElementById('submit-form-inner').style.display='none';
    document.getElementById('submit-success').style.display='block';
    document.getElementById('success-order-num').textContent=pid;
    buildTabs();
  }catch(e){toast('⚠️ 送出失敗，請稍後再試');console.error(e);}
}

async function acceptPending(pid){
  const p=pendingSubmits.find(x=>x.id===pid);if(!p)return;
  const c={id:nextId(),client:p.client,contact:p.contact,type:p.type,desc:p.desc,
    ref:p.ref||'',price:p.budget||'',month:p.month,due:p.due||'',status:'待確認',
    purpose:p.purpose||'私人',charCount:p.charCount||1,payment:'尚未付款',
    note:`投單申請 (${p.id})`,createdAt:new Date().toISOString()};
  try{
    await dbInsert('commissions',localToDB(c));
    await dbUpsert('app_settings',[{key:'pidmap_'+pid,value:c.id}]);
    await dbDelete('pending_submits','?id=eq.'+pid);
    await persistSettings();
    commissions.unshift(c);
    pendingSubmits=pendingSubmits.filter(x=>x.id!==pid);
    renderReview();renderQueue();renderStats();buildTabs();
    toast(`已接受 → ${c.id}`);
  }catch(e){toast('⚠️ 操作失敗');console.error(e);}
}

async function confirmReject(pid){
  const reason=(document.getElementById('rejreason-'+pid)?.value||'').trim();
  try{
    await dbInsert('rejections',{pending_id:pid,reason});
    await dbDelete('pending_submits','?id=eq.'+pid);
    pendingSubmits=pendingSubmits.filter(x=>x.id!==pid);
    renderReview();buildTabs();toast('已拒絕該申請');
  }catch(e){toast('⚠️ 操作失敗');console.error(e);}
}

// ══ QUEUE (FIX 5: drag to reorder) ══
function renderQueue(){
  const q=(document.getElementById('search-input')?.value||'').toLowerCase();
  const sf=document.getElementById('filter-status')?.value||'';
  const ORD={'待確認':0,'已確認':1,'構圖中':2,'待審構圖':3,'線稿中':4,'待審線稿':5,'上色中':6,'待審色稿':7,'完成':8,'修改中':9,'取消':10};
  let list=commissions.filter(c=>
    (!q||c.client.toLowerCase().includes(q)||c.id.toLowerCase().includes(q))&&(!sf||c.status===sf));
  // only auto-sort when no custom order AND no filter active
  if(!settings.sortOrder?.length && !q && !sf){
    list.sort((a,b)=>(ORD[a.status]??9)-(ORD[b.status]??9));
  }
  const el=document.getElementById('queue-list');
  if(!list.length){el.innerHTML='<div class="empty-state">沒有符合條件的委託</div>';return;}

  const activeIds=commissions.filter(c=>!['完成','取消'].includes(c.status)).map(c=>c.id);
  el.innerHTML=list.map((c,i)=>{
    const qp=activeIds.indexOf(c.id);
    const pos=qp>=0?`<span class="qpos">排隊 #${qp+1}</span>`:'';
    const mon=c.month?`<span class="qpos">${MZH[c.month-1]}</span>`:'';
    const payIcon={'尚未付款':'⚪','匯款（銀行/街口/LINE Pay）':'🏦','無卡分期（綠界）':'💳','已付清':'✅'};
    const payClr={'尚未付款':'#8F889B','匯款（銀行/街口/LINE Pay）':'var(--link)','無卡分期（綠界）':'#A4507A','已付清':'var(--sage)'};
    const payLabel=c.payment?`<span style="font-size:.72rem;color:${payClr[c.payment]||'#8F889B'};">${payIcon[c.payment]||''} ${esc(c.payment)}</span>`:'';
    const refHtml=c.ref?c.ref==='【私訊提供】'
      ?`<span style="font-size:.76rem;color:var(--muted);">💬 參考圖私訊提供</span>`
      :`<a href="${esc(c.ref)}" target="_blank" style="color:var(--link);font-size:.76rem;">🔗 參考圖</a>`:'' ;
    return`<div class="com-card" data-status="${c.status}" data-id="${c.id}" draggable="true">
      <div class="cc-head">
        <div class="cc-meta">
          <span class="drag-handle" title="拖曳排序">⠿</span>
          <span class="onum">${c.id}</span><span class="cname">${esc(c.client)}</span>
          <span class="ctype">${c.type}${c.price?' · '+esc(c.price):''}</span>
          ${c.charCount?`<span class="qpos">👤 ${c.charCount}人</span>`:''}
          ${c.purpose?purposeBadge(c.purpose):''}${pos}${mon}
        </div>
        <span class="sbadge s${c.status}">${c.status}</span>
      </div>
      <div class="cc-body">
        ${c.desc?`<div>${esc(c.desc)}</div>`:''}
        ${c.contact?`<div style="font-size:.76rem;">聯絡：${esc(c.contact)}</div>`:''}
        ${payLabel} ${refHtml}
        ${c.note?`<div class="cc-note">🗒 ${esc(c.note)}</div>`:''}
      </div>
      <div class="cc-foot">
        <span class="cc-date">${c.due?'📅 '+c.due:''}</span>
        <div class="cc-acts">
          <select class="isel" onchange="quickStatus('${c.id}',this.value)">
            ${ALL_STATUSES.map(s=>`<option${s===c.status?' selected':''}>${s}</option>`).join('')}
          </select>
          <button class="btn btn-sage btn-sm" onclick="openEdit('${c.id}')">編輯</button>
          <button class="btn btn-rust btn-sm" onclick="delCommission('${c.id}')">刪除</button>
        </div>
      </div>
    </div>`;
  }).join('');
  if(!q&&!sf) attachDragSort();
}

function attachDragSort(){
  const list=document.getElementById('queue-list');
  let dragSrc=null;
  list.querySelectorAll('.com-card').forEach(card=>{
    card.addEventListener('dragstart',e=>{
      dragSrc=card;card.classList.add('dragging');
      e.dataTransfer.effectAllowed='move';
    });
    card.addEventListener('dragend',()=>{
      card.classList.remove('dragging');
      list.querySelectorAll('.com-card').forEach(c=>c.classList.remove('drag-over'));
    });
    card.addEventListener('dragover',e=>{e.preventDefault();if(dragSrc!==card)card.classList.add('drag-over');});
    card.addEventListener('dragleave',()=>card.classList.remove('drag-over'));
    card.addEventListener('drop',e=>{
      e.preventDefault();card.classList.remove('drag-over');
      if(!dragSrc||dragSrc===card)return;
      const si=commissions.findIndex(c=>c.id===dragSrc.dataset.id);
      const ti=commissions.findIndex(c=>c.id===card.dataset.id);
      if(si<0||ti<0)return;
      commissions.splice(ti,0,commissions.splice(si,1)[0]);
      saveSortOrder();renderQueue();renderStats();
    });
  });
}

async function quickStatus(id,status){
  const c=commissions.find(x=>x.id===id);if(!c)return;
  const old=c.status; c.status=status;
  try{
    await dbUpdate('commissions','?id=eq.'+id,{status});
    renderQueue();renderStats();toast(`${c.id} → ${status}`);
  }catch(e){c.status=old;toast('⚠️ 更新失敗');renderQueue();}
}

function renderDdEditor(containerId,items,key){
  const el=document.getElementById(containerId);if(!el)return;
  el.innerHTML=`<ul class="dd-list" id="ddlist-${key}">
    ${items.map((v,i)=>`<li class="dd-item" draggable="true" data-i="${i}">
      <span>${esc(v)}</span><button onclick="ddRemove('${key}',${i})" title="刪除">✕</button>
    </li>`).join('')}
  </ul>
  <div class="dd-add-row">
    <input type="text" id="ddinput-${key}" placeholder="新增選項…" onkeydown="if(event.key==='Enter')ddAdd('${key}')">
    <button class="btn btn-primary btn-sm" onclick="ddAdd('${key}')">＋</button>
  </div>`;
  const list=document.getElementById('ddlist-'+key);
  let dragSrc=null;
  list.querySelectorAll('.dd-item').forEach(item=>{
    item.addEventListener('dragstart',e=>{dragSrc=item;item.style.opacity='.4';});
    item.addEventListener('dragend',()=>{item.style.opacity='1';});
    item.addEventListener('dragover',e=>{e.preventDefault();});
    item.addEventListener('drop',e=>{
      e.preventDefault();if(dragSrc===item)return;
      const all=[...list.querySelectorAll('.dd-item')];
      const from=all.indexOf(dragSrc),to=all.indexOf(item);
      const arr=settings[key];arr.splice(to,0,arr.splice(from,1)[0]);
      renderDdEditor(containerId,arr,key);
    });
  });
}
function ddAdd(key){
  const inp=document.getElementById('ddinput-'+key);if(!inp)return;
  const v=inp.value.trim();if(!v)return;
  if(!settings[key].includes(v))settings[key].push(v);
  inp.value='';
  const map={commissionTypes:'dd-types',purposes:'dd-purposes',paymentMethods:'dd-payments'};
  renderDdEditor(map[key],settings[key],key);
}
function ddRemove(key,i){
  settings[key].splice(i,1);
  const map={commissionTypes:'dd-types',purposes:'dd-purposes',paymentMethods:'dd-payments'};
  renderDdEditor(map[key],settings[key],key);
}
async function saveSettings(){
  settings.announcement=document.getElementById('s-announcement').value.trim();
  settings.priceNote=document.getElementById('s-price-note').value.trim();
  settings.contactLink=document.getElementById('s-contact-link').value.trim();
  settings.contactName=document.getElementById('s-contact-name').value.trim();
  for(let m=1;m<=12;m++) settings.slots[m]={
    open:document.getElementById(`so-${m}`)?.checked||false,
    limit:+document.getElementById(`sl-${m}`)?.value||0};
  try{
    await persistSettings();
    refreshDynamicSelects();
    toast('設定已儲存');
  }catch(e){toast('⚠️ 儲存失敗：'+e.message);console.error(e);}
}
function resetSettings(){
  if(!confirm('確定還原預設？'))return;
  const saved={idCounter:settings.idCounter,sortOrder:settings.sortOrder};
  settings=mkDefaultSettings();
  Object.assign(settings,saved);
  renderSettingsPage();
  toast('已還原（請記得儲存）');
}

// ══ LOOKUP (name + last 4 digits) ══
async function doLookup(){
  const name=(document.getElementById('lookup-name').value||'').trim().toLowerCase();
  const suffix=(document.getElementById('lookup-suffix').value||'').trim().replace(/\D/g,'').padStart(4,'0');
  const el=document.getElementById('lookup-result');
  if(!name){toast('請輸入您的稱呼');return;}
  if(!suffix||suffix.length<4){toast('請輸入單號末四碼');return;}

  el.innerHTML='<div class="loading">查詢中…</div>';

  try{
    // Search commissions matching name (case-insensitive via ilike) and id ending with suffix
    const coms=await dbGet('commissions',`?client=ilike.${encodeURIComponent(name)}&id=like.*${suffix}`);
    if(coms&&coms.length){
      renderResult(el,dbToLocal(coms[0]));return;
    }
    // Search pending_submits
    const pends=await dbGet('pending_submits',`?client=ilike.${encodeURIComponent(name)}&id=like.*${suffix}`);
    if(pends&&pends.length){
      const p=dbPendToLocal(pends[0]);
      // check if already accepted
      const maps=await dbGet('app_settings','?key=eq.pidmap_'+p.id);
      if(maps&&maps.length){
        const coms2=await dbGet('commissions','?id=eq.'+maps[0].value);
        if(coms2&&coms2.length){renderResult(el,dbToLocal(coms2[0]));return;}
      }
      el.innerHTML=`<div class="result-card" style="text-align:center;padding:1.6rem;">
        <div style="font-size:1.8rem;margin-bottom:.45rem;">⏳</div>
        <p style="font-weight:600;margin-bottom:.25rem;">申請審核中</p>
        <p style="color:var(--muted);font-size:.82rem;">您的申請正在等待繪師審核，請稍後再查詢。</p>
      </div>`;return;
    }
    // Check rejections by suffix match
    const allRej=await dbGet('rejections','?pending_id=like.*'+suffix);
    if(allRej&&allRej.length){
      const r=allRej[0];
      el.innerHTML=`<div class="result-card" style="text-align:center;padding:1.6rem;">
        <div style="font-size:1.8rem;margin-bottom:.45rem;">😔</div>
        <p style="font-weight:600;margin-bottom:.25rem;">申請未通過審核</p>
        <p style="color:var(--muted);font-size:.82rem;">${r.reason?'原因：'+esc(r.reason):'如有疑問請私訊繪師。'}</p>
      </div>`;return;
    }
    el.innerHTML=`<div class="result-card" style="text-align:center;padding:1.6rem;">
      <div style="font-size:1.8rem;margin-bottom:.45rem;">🔍</div>
      <p style="color:var(--muted);">找不到符合的委託<br>
      <span style="font-size:.78rem;">請確認稱呼與單號末四碼是否正確</span></p>
    </div>`;
  }catch(e){
    console.error(e);
    el.innerHTML=`<div class="result-card" style="text-align:center;padding:1.6rem;">
      <p style="color:var(--muted);">查詢失敗，請稍後再試</p>
    </div>`;
  }
}

function renderResult(el,c){
  const cancelled=c.status==='取消';
  const ci=STATUS_STEPS.indexOf(c.status);
  const steps=STATUS_STEPS.map((s,i)=>{
    const cls=cancelled?'':i<ci?'done':i===ci?'curr':'';
    const dot=cls==='done'?'✓':cls==='curr'?'●':'';
    return`<div class="step ${cls}"><div class="sdot">${dot}</div><div class="slabel">${s}</div></div>`;
  }).join('');
  const mon=c.month?MZH[c.month-1]:'—';
  el.innerHTML=`<div class="result-card">
    <div class="res-head">
      <div><div class="res-order">${c.id}</div>
      <div style="font-size:.8rem;color:var(--muted);">${esc(c.client)} · ${c.type} · ${mon}</div>
      ${c.purpose?`<div style="margin-top:.2rem;">${purposeBadge(c.purpose)}</div>`:''}</div>
      <span class="sbadge s${c.status}">${c.status}</span>
    </div>
    ${cancelled?'<p style="color:var(--rose);font-size:.83rem;font-weight:600;margin-bottom:.45rem;">✕ 此委託已取消</p>':''}
    <div class="prog-steps">${steps}</div>
    <dl class="res-dl">
      ${c.desc?`<dt>委託內容</dt><dd>${esc(c.desc)}</dd>`:''}
      ${c.due?`<dt>預計完成</dt><dd>📅 ${c.due}</dd>`:''}
      <dt>建立日期</dt><dd>${new Date(c.createdAt).toLocaleDateString('zh-TW')}</dd>
    </dl>
  </div>`;
}

// ══ DYNAMIC SELECTS ══
function opts(items,selected=''){return items.map(v=>`<option${v===selected?' selected':''}>${esc(v)}</option>`).join('');}
function refreshDynamicSelects(){
  const map={'f-type':settings.commissionTypes,'f-purpose':settings.purposes,'f-payment':settings.paymentMethods,
    'edit-type':settings.commissionTypes,'edit-purpose':settings.purposes,'edit-payment':settings.paymentMethods};
  Object.entries(map).forEach(([id,items])=>{
    const el=document.getElementById(id);if(!el)return;
    const cur=el.value;el.innerHTML=opts(items);if(items.includes(cur))el.value=cur;
  });
}

// ══ UTILS ══
function purposeBadge(p){
  const map={'🔒 私人':{bg:'#E3E8F5',color:'#3D4F87'},'📦 製品':{bg:'#ECE6F5',color:'#5F4E86'},'💼 商業':{bg:'#F6E4EC',color:'#8A3F63'}};
  const s=map[p]||{bg:'#EEECF0',color:'#5F5969'};
  return`<span style="display:inline-block;background:${s.bg};color:${s.color};font-size:.68rem;padding:.1rem .5rem;border-radius:20px;font-weight:600;">${esc(p)}</span>`;
}
function closeModal(id){document.getElementById(id).classList.remove('open');}
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function toast(msg){
  const el=document.createElement('div');el.className='toast';el.textContent=msg;
  document.body.appendChild(el);
  setTimeout(()=>{el.classList.add('hide');setTimeout(()=>el.remove(),350);},2800);
}

// ══ INIT ══
async function init(){
  buildTabs();
  await loadSettings();
  await loadAll();
  refreshDynamicSelects();
  renderSubmitPage();
}
init();

document.getElementById('edit-modal').addEventListener('click',e=>{if(e.target===document.getElementById('edit-modal'))closeModal('edit-modal');});
document.getElementById('pw-modal').addEventListener('click',e=>{if(e.target===document.getElementById('pw-modal'))closeModal('pw-modal');});
document.getElementById('lookup-name').addEventListener('keydown',e=>{if(e.key==='Enter')doLookup();});
document.getElementById('lookup-suffix').addEventListener('keydown',e=>{if(e.key==='Enter')doLookup();});
</script>
